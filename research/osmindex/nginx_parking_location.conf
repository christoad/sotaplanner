    # Parking and trailhead list, one file per 0.2 degree map square (built from OSM in /var/lib/osmindex).
    location ^~ /parking/ {
        if ($brouter_key_ok = 0) { return 401; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=parking burst=40 nodelay;
        alias /var/lib/parking/cells/;
        autoindex off;
        default_type text/plain;
        charset utf-8;
        gzip on;
        gzip_types text/plain application/json;
        add_header Cache-Control "private, max-age=86400";
    }

limit_req_zone $binary_remote_addr zone=parking:10m rate=10r/s;
