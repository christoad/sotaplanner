include /etc/nginx/brouter_key.conf;

server {
    server_name hikepath.sotaplanner.com;

    location = /brouter {
        if ($brouter_key_ok = 0) { return 401; }
        if ($request_method != GET) { return 405; }
        limit_req zone=brouter burst=40 nodelay;
        access_log /var/log/nginx/access.log;
        access_log /var/log/nginx/brouter_timed.log brouter_timed;
        proxy_pass http://127.0.0.1:17777;
        proxy_read_timeout 70s;
    }
    # Parking and trailhead list, one file per 0.2 degree map square (built from OSM in /var/lib/osmindex).
    location ^~ /parking/ {
        if ($brouter_key_ok = 0) { return 401; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=parking burst=40 nodelay;
        alias /var/lib/parking/cells/;
        autoindex off;
        default_type text/plain;
        charset utf-8;
        gzip on;
        gzip_types text/plain application/json;
        add_header Cache-Control "private, max-age=86400";
    }
    # Server status for the SOTAplanner pages (written every minute by brouter-status.timer)
    location = /status.json {
        if ($brouter_key_ok = 0) { return 401; }
        alias /var/lib/brouter-status/status.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }
    location / { return 404; }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hikepath.sotaplanner.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hikepath.sotaplanner.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = hikepath.sotaplanner.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name hikepath.sotaplanner.com;
    return 404; # managed by Certbot


}